name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Initialize Android project configuration
        run: |
          echo "Configuring Android project scaffold..."
          flutter create --platforms=android --org com.auracalc.app .

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Verify APK was generated
        run: |
          echo "Checking generated APK files:"
          ls -lah build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ./AuraCalc-v1.0.0-release.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraCalc-Android-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            ./AuraCalc-v1.0.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release and Upload APK (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./AuraCalc-v1.0.0-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
