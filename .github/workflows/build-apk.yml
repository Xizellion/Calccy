name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Flutter Analytics & Diagnostics
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Accept Android SDK Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Setup Android Project Scaffold
        run: |
          echo "Setting up Flutter Android build scaffold..."
          # If android scaffold needs initialization, use explicit valid package name
          flutter create --project-name auracalc --org com.auracalc.app --platforms=android .
          # Ensure execution permissions for gradle wrapper
          chmod +x android/gradlew || true

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Check and Prepare APK Artifact
        run: |
          echo "Inspecting generated APK outputs:"
          ls -lah build/app/outputs/flutter-apk/ || ls -lah build/app/outputs/apk/release/ || true
          
          # Copy release APK to root with clean versioned name
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk ./AuraCalc-v1.0.0-release.apk
            echo "Release APK copied successfully!"
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            cp build/app/outputs/apk/release/app-release.apk ./AuraCalc-v1.0.0-release.apk
            echo "Release APK copied from release dir!"
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraCalc-Android-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            ./AuraCalc-v1.0.0-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release and Upload APK (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./AuraCalc-v1.0.0-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
